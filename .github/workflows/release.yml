name: Release binaries

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.lock
      - Cargo.toml
      - src/**
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            runner: macos-15
            target: aarch64-apple-darwin
            package: moorebot-scout-aarch64-apple-darwin.tar.gz
            platform: unix
          - label: macOS (Intel)
            runner: macos-15-intel
            target: x86_64-apple-darwin
            package: moorebot-scout-x86_64-apple-darwin.tar.gz
            platform: unix
          - label: Windows (x64)
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            package: moorebot-scout-x86_64-pc-windows-msvc.zip
            platform: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal --target ${{ matrix.target }}
      - name: Build executable
        run: cargo +1.98.0 build --release --locked --target ${{ matrix.target }}
      - name: Package executable
        if: matrix.platform == 'unix'
        shell: bash
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.package }}" moorebot-scout
      - name: Package executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -LiteralPath "target/${{ matrix.target }}/release/moorebot-scout.exe" -DestinationPath "dist/${{ matrix.package }}"
      - name: Upload executable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.package }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag matches Cargo version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          test "$RELEASE_TAG" = "v$package_version"
      - name: Download executable packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum moorebot-scout-* > SHA256SUMS
      - name: Publish hardware-preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --verify-tag
          --generate-notes
          --prerelease
          --title "Moorebot Scout ${{ github.ref_name }} (hardware preview)"
