name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [1.98.0, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Run all-target tests
        run: cargo +${{ matrix.rust }} test --all-targets --locked
      - name: Run protocol-only tests
        run: cargo +${{ matrix.rust }} test --all-targets --no-default-features --locked

  quality:
    name: Formatting, lint, docs, and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust tooling
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --all-targets --all-features --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --all-features --no-deps --locked
      - name: Validate package metadata
        run: cargo +stable metadata --locked --format-version 1 --no-deps
