[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moorebot-scout-client"
version = "0.2.0"
description = "Python client for the local moorebot-scout integration bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Corey Montella", email = "corey@mech-lang.org" }]
dependencies = []

[project.optional-dependencies]
vision = ["numpy>=1.24", "opencv-python>=4.8"]

[tool.setuptools.packages.find]
where = ["src"]
