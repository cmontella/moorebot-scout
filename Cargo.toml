[package]
name = "moorebot-scout"
authors = ["Corey Montella <corey@mech-lang.org>"]
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
description = "A driver and protocol library for the Moorebot Scout"
documentation = "https://docs.rs/moorebot-scout"
homepage = "https://github.com/cmontella/moorebot-scout"
repository = "https://github.com/cmontella/moorebot-scout"
license = "Apache-2.0"
publish = false
readme = "README.md"
keywords = ["moorebot", "scout", "ros", "robotics"]
categories = ["science::robotics", "hardware-support"]
include = [
  "src/**",
  "tests/**",
  "examples/**",
  "docs/**",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "SECURITY.md",
  "LICENSE",
]

# Keep this future standalone repository independent of the enclosing Mech workspace.
[workspace]

[features]
default = ["ros1"]
ros1 = [
  "dep:clap",
  "dep:crossterm",
  "dep:ctrlc",
  "dep:env_logger",
  "dep:rosrust",
  "dep:windows-sys",
]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
crossterm = { version = "0.29", optional = true }
ctrlc = { version = "3.5", optional = true }
env_logger = { version = "0.11", optional = true }
rosrust = { git = "https://github.com/cmontella/rosrust", rev = "e8646bfc7e7a1ae4c19f45a9f209b74b0d61eecd", version = "0.9.12", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"], optional = true }

[[bin]]
name = "moorebot-scout"
path = "src/main.rs"
required-features = ["ros1"]
